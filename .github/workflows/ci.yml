name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Same base as the media sandbox: Debian trixie, ffmpeg 7.1.
  debian:
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core tesseract-ocr tesseract-ocr-eng && pip install uv
      - run: uv run playwright install --with-deps chromium
      # mmk for the .mmkproj export tests: the build the Renoise sandbox installs (Worker SANDBOX_MMK), rendering on Mesa's
      # software Vulkan. The URL needs a user agent (Cloudflare's browser check); the sha256 is the Worker's.
      - name: mmk
        run: |
          apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libegl1 libgles2 libva2 libasound2t64
          curl -fsSL -A renoise-kit-ci -o /tmp/mmk.tar.gz https://assets.renoise.ai/static/sandbox/mmk/mmk-native-0.2.0-linux-x64.tar.gz
          echo "d74e99c78f0977bb871d44c8944b3ba7910da98bf934076e050c4049c0ff6692  /tmp/mmk.tar.gz" | sha256sum -c
          mkdir -p /opt/mmk && tar -xzf /tmp/mmk.tar.gz -C /opt/mmk --strip-components=1
          /opt/mmk/bin/mmk version --json
          echo "RN_MMK=/opt/mmk/bin/mmk" >> "$GITHUB_ENV"
      - run: uv run pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Homebrew's plain ffmpeg has no libass; ffmpeg-full is keg-only.
      - run: brew install ffmpeg-full && echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: uv run playwright install chromium
      - run: uv run pytest -q

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '0'  # keep Windows' own default encoding, so a missing encoding='utf-8' shows up here
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # gyan.dev's full build: ffmpeg 7+ with libass and fontconfig, the same build the README points Windows users to.
      # Taken from gyan's GitHub release: Chocolatey's feed stopped resolving ffmpeg-full (9.0.2).
      - run: |
          cd "$(cygpath -u "$RUNNER_TEMP")"
          gh release download --repo GyanD/codexffmpeg --pattern '*-full_build.zip' --output ffmpeg.zip
          7z x -y ffmpeg.zip > /dev/null
          cygpath -w "$PWD/$(ls -d ffmpeg-*-full_build)/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run playwright install chromium
      - run: uv run pytest -q
