name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Same base as the media sandbox: Debian trixie, ffmpeg 7.1.
  debian:
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core tesseract-ocr tesseract-ocr-eng && pip install uv
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Homebrew's plain ffmpeg has no libass; ffmpeg-full is keg-only.
      - run: brew install ffmpeg-full && echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: uv run playwright install chromium
      - run: uv run pytest -q

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '0'  # keep Windows' own default encoding, so a missing encoding='utf-8' shows up here
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # gyan.dev's full build: ffmpeg 7+ with libass and fontconfig, the same build the README points Windows users to.
      # Taken from gyan's GitHub release: Chocolatey's feed stopped resolving ffmpeg-full (9.0.2).
      - run: |
          cd "$(cygpath -u "$RUNNER_TEMP")"
          gh release download --repo GyanD/codexffmpeg --pattern '*-full_build.zip' --output ffmpeg.zip
          7z x -y ffmpeg.zip > /dev/null
          cygpath -w "$PWD/$(ls -d ffmpeg-*-full_build)/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run playwright install chromium
      - run: uv run pytest -q
