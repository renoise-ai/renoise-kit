[project]
name = "renoise-kit"
dynamic = ["version"]
description = "rn: frame-exact probing, contact sheets, EDL assembly, finishing and QA for AI video edits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pillow>=10.1"]

# The media sandbox installs everything; locally pick what you use. ffmpeg/ffprobe (with libass) come from the system.
[project.optional-dependencies]
listen = ["numpy", "librosa", "matplotlib"]
transcribe = ["numpy", "faster-whisper"]
faces = ["opencv-python-headless>=4.8"]
capture = ["playwright"]
captions = ["pysubs2"]
fonts = ["fonttools"]
fx = ["numpy"]
all = ["renoise-kit[listen,transcribe,faces,capture,captions,fonts,fx]"]

# uv run pytest. faster-whisper is left out (large); its test skips.
[dependency-groups]
dev = ["pytest", "numpy", "librosa", "matplotlib", "opencv-python-headless>=4.8", "pysubs2", "playwright", "fonttools"]

[project.urls]
Homepage = "https://renoise.ai"
Source = "https://github.com/renoise-ai/renoise-kit"

[project.scripts]
rn = "rn.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license expression
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rn", "rn.fx"]

[tool.setuptools.package-data]
"rn" = ["ref_guide.md"]
"rn.fx" = ["fx.js"]

[tool.setuptools.dynamic]
version = { attr = "rn.__version__" }
